name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Test configuration
  AUTH_USERS: '{"tester": {"password_hash": "$2b$12$LQv3c1yqBWVHxkd0LHAkCOYz6TtxMQJqhN8/LewdBPj/RK.PZvO.S", "roles": ["analyst"]}, "admin": {"password_hash": "$2b$12$LQv3c1yqBWVHxkd0LHAkCOYz6TtxMQJqhN8/LewdBPj/RK.PZvO.S", "roles": ["admin"]}}'
  MONGODB_URI: "mongodb://localhost:27017"
  MONGODB_DATABASE: "q_guardian_test"
  RATE_LIMIT_ENABLED: "false"
  APP_ENVIRONMENT: "testing"
  LOG_LEVEL: "INFO"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy src/q_guardian/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Initialize test database
        run: |
          python scripts/ci_init_db.py
        env:
          AUTH_USERS: ${{ env.AUTH_USERS }}
          MONGODB_URI: ${{ env.MONGODB_URI }}
          MONGODB_DATABASE: ${{ env.MONGODB_DATABASE }}
      - name: Run full test suite with coverage gate
        run: >
          pytest tests/ --tb=short -q
          --cov=q_guardian --cov-report=xml --cov-report=term
          --cov-fail-under=80
        env:
          AUTH_USERS: ${{ env.AUTH_USERS }}
          MONGODB_URI: ${{ env.MONGODB_URI }}
          MONGODB_DATABASE: ${{ env.MONGODB_DATABASE }}
          RATE_LIMIT_ENABLED: ${{ env.RATE_LIMIT_ENABLED }}
          APP_ENVIRONMENT: ${{ env.APP_ENVIRONMENT }}
          LOG_LEVEL: ${{ env.LOG_LEVEL }}
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml

  security-tests:
    name: Security Test Suite
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Initialize test database
        run: |
          python scripts/ci_init_db.py
        env:
          AUTH_USERS: ${{ env.AUTH_USERS }}
          MONGODB_URI: ${{ env.MONGODB_URI }}
          MONGODB_DATABASE: ${{ env.MONGODB_DATABASE }}
      - name: Injection / jailbreak / obfuscation / false-positive regression
        run: pytest tests/security/ -v --tb=short
        env:
          AUTH_USERS: ${{ env.AUTH_USERS }}
          MONGODB_URI: ${{ env.MONGODB_URI }}
          MONGODB_DATABASE: ${{ env.MONGODB_DATABASE }}
          RATE_LIMIT_ENABLED: ${{ env.RATE_LIMIT_ENABLED }}
          APP_ENVIRONMENT: ${{ env.APP_ENVIRONMENT }}
          LOG_LEVEL: ${{ env.LOG_LEVEL }}
      - name: Generate security metrics report
        run: python -m scripts.qa.security_report
        env:
          AUTH_USERS: ${{ env.AUTH_USERS }}
          MONGODB_URI: ${{ env.MONGODB_URI }}
          MONGODB_DATABASE: ${{ env.MONGODB_DATABASE }}
      - name: Fail on regression below documented gates
        run: pytest tests/security/test_security_metrics.py -q
        env:
          AUTH_USERS: ${{ env.AUTH_USERS }}
          MONGODB_URI: ${{ env.MONGODB_URI }}
          MONGODB_DATABASE: ${{ env.MONGODB_DATABASE }}

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Audit both the lock-style runtime requirements and the package extras.
      - run: pip install -r requirements.txt pip-audit
      - name: pip-audit (runtime requirements)
        run: pip-audit -r requirements.txt --strict
      - name: pip-audit (current environment incl. dev tooling)
        run: pip-audit --strict

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" build
      - run: python -m build
      - run: python -m scripts.packaging.validate
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: q-guardian:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max