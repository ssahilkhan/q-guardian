# pytest configuration for CI environment
# This file is loaded when running pytest with -c pytest-ci.ini

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# CI-specific settings
addopts = 
    -v
    --tb=short
    --strict-markers
    --asyncio-mode=auto
    -p tests.conftest_ci

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    security: Security tests
    ml: Machine learning tests

# Test collection
norecursedirs = .git .venv venv __pycache__ .pytest_cache .mypy_cache dist build artifacts reports scripts/ml/__pycache__

# Output
verbosity = 1
showlocals = false

# CI-specific settings
# - Mock ML models to avoid loading heavy models
# - Use test authentication
# - Use test database
# - Skip slow tests if needed

# Test filtering for CI
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning