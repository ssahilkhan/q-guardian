[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "q-guardian"
version = "1.1.0"
description = "Q-Guardian: A Hybrid Quantum-Classical Framework for Runtime Security of Autonomous AI Agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Q-Guardian Research Team"},
]
keywords = ["quantum", "security", "ai", "agents", "cybersecurity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "motor>=3.7.0",
    "pymongo>=4.11.0",
    "structlog>=24.0.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "orjson>=3.10.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]
ml-xgboost = [
    "xgboost>=2.0.0",
]
datasets = [
    "datasets>=2.14.0",
]
quantum = [
    "qiskit>=1.0.0",
    "qiskit-machine-learning>=0.7.0",
    "qiskit-aer>=0.13.0",
    "numpy>=1.24.0",
]
quantum-pennylane = [
    "pennylane>=0.35.0",
    "pennylane-lightning>=0.35.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "mongomock>=4.2.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "types-PyYAML>=6.0.12",
    "types-python-jose>=3.3.0",
]

[project.scripts]
q-guardian = "q_guardian.cli:main"

[project.urls]
Homepage = "https://github.com/ssahilkhan/q-guardian"
Documentation = "https://github.com/ssahilkhan/q-guardian"
Repository = "https://github.com/ssahilkhan/q-guardian"
Issues = "https://github.com/ssahilkhan/q-guardian/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
q_guardian = ["ui/static/**"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = ["T201"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["q_guardian.schemas.base.BaseSchema"]

[tool.ruff.lint.isort]
known-first-party = ["q_guardian"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "qiskit.*",
    "qiskit_aer.*",
    "qiskit_ibm_runtime.*",
    "datasets.*",
    "sklearn.*",
    "joblib",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src/q_guardian"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
]
