<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Q-Guardian Console</title>
  <meta name="description" content="Q-Guardian web console — runtime security control plane for the hybrid quantum-classical prompt analysis pipeline." />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
  <link rel="stylesheet" href="css/console.css?v=2" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="favicon.svg" alt="" aria-hidden="true" />
        <div class="brand-text">
          <h1>Q-Guardian</h1>
          <p>Runtime Security Console</p>
        </div>
      </div>
      <nav id="sideNav" class="side-nav" aria-label="Console navigation"></nav>
      <div class="sidebar-footer">
        <span id="versionInfo">Loading…</span>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
        <div class="topbar-right">
          <div id="userBar" class="user-bar"></div>
          <div class="sys-status">
            <span class="pulse" id="statusDot" aria-hidden="true"></span>
            <span id="statusText">checking…</span>
          </div>
        </div>
      </header>

      <main id="appView" class="content">
        <div id="bootState" class="empty-state">
          <div class="spinner" aria-hidden="true"></div>
          <p>Loading console…</p>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="js/api.js?v=2"></script>
  <script src="js/ui.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="js/views/login.js?v=2"></script>
  <script src="js/views/dashboard.js?v=2"></script>
  <script src="js/views/scanner.js?v=2"></script>
  <script src="js/views/detection.js?v=2"></script>
  <script src="js/views/pipeline.js?v=2"></script>
  <script src="js/views/rules.js?v=2"></script>
  <script src="js/views/models.js?v=2"></script>
  <script src="js/views/quantum.js?v=2"></script>
  <script src="js/views/training.js?v=2"></script>
  <script src="js/views/evaluation.js?v=2"></script>
  <script src="js/views/benchmarks.js?v=2"></script>
  <script src="js/views/audit.js?v=2"></script>
  <script src="js/views/configuration.js?v=2"></script>
  <script src="js/views/documentation.js?v=2"></script>
  <script src="js/console.js?v=2"></script>
</body>
</html>
