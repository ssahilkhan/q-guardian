<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Q-Guardian Console</title>
  <meta name="description" content="Q-Guardian web console — runtime security control plane for the hybrid quantum-classical prompt analysis pipeline." />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/console.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="favicon.svg" alt="" aria-hidden="true" />
        <div class="brand-text">
          <h1>Q-Guardian</h1>
          <p>Runtime Security Console</p>
        </div>
      </div>
      <nav id="sideNav" class="side-nav" aria-label="Console navigation"></nav>
      <div class="sidebar-footer">
        <span id="versionInfo">Loading…</span>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
        <div class="sys-status">
          <span class="pulse" id="statusDot" aria-hidden="true"></span>
          <span id="statusText">checking…</span>
        </div>
      </header>

      <main id="appView" class="content">
        <div id="bootState" class="empty-state">
          <div class="spinner" aria-hidden="true"></div>
          <p>Loading console…</p>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/scanner.js"></script>
  <script src="js/views/detection.js"></script>
  <script src="js/views/pipeline.js"></script>
  <script src="js/views/rules.js"></script>
  <script src="js/views/models.js"></script>
  <script src="js/views/quantum.js"></script>
  <script src="js/views/training.js"></script>
  <script src="js/views/evaluation.js"></script>
  <script src="js/views/benchmarks.js"></script>
  <script src="js/views/audit.js"></script>
  <script src="js/views/configuration.js"></script>
  <script src="js/views/documentation.js"></script>
  <script src="js/console.js"></script>
</body>
</html>
