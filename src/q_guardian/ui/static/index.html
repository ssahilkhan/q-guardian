<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Q-Guardian Console</title>
  <meta name="description" content="Q-Guardian web console — runtime security control plane for the hybrid quantum-classical prompt analysis pipeline." />
  <meta name="color-scheme" content="light" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3" />
  <link rel="stylesheet" href="css/console.css?v=3" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="favicon.svg" alt="" aria-hidden="true" />
        <div class="brand-text">
          <h1>Q-Guardian</h1>
          <p>Runtime Security Console</p>
        </div>
      </div>
      <nav id="sideNav" class="side-nav" aria-label="Console navigation"></nav>
      <div class="sidebar-footer">
        <span id="versionInfo">Loading…</span>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button id="navToggle" class="nav-toggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="sideNav">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
        </div>
        <div class="sys-status">
          <span class="pulse" id="statusDot" aria-hidden="true"></span>
          <span id="statusText">checking…</span>
        </div>
      </header>

      <main id="appView" class="content">
        <div id="bootState" class="empty-state">
          <div class="spinner" aria-hidden="true"></div>
          <p>Loading console…</p>
        </div>
      </main>
    </div>
  </div>

  <div id="navBackdrop" class="nav-backdrop" hidden></div>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="false"></div>

  <script src="js/api.js?v=3"></script>
  <script src="js/live.js?v=3"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/livePanel.js?v=3"></script>
  <script src="js/views/dashboard.js?v=3"></script>
  <script src="js/views/scanner.js?v=3"></script>
  <script src="js/views/detection.js?v=3"></script>
  <script src="js/views/pipeline.js?v=3"></script>
  <script src="js/views/rules.js?v=3"></script>
  <script src="js/views/models.js?v=3"></script>
  <script src="js/views/quantum.js?v=3"></script>
  <script src="js/views/training.js?v=3"></script>
  <script src="js/views/evaluation.js?v=3"></script>
  <script src="js/views/benchmarks.js?v=3"></script>
  <script src="js/views/audit.js?v=3"></script>
  <script src="js/views/configuration.js?v=3"></script>
  <script src="js/views/documentation.js?v=3"></script>
  <script src="js/console.js?v=3"></script>
</body>
</html>
